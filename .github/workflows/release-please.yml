name: release-please

on:
  push:
    branches: [main]

# The GITHUB_TOKEN needs these to open the release PR and, on merge, create the
# tag and GitHub Release. (Opening PRs also requires the repo setting
# "Allow GitHub Actions to create and approve pull requests".)
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
